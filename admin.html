<body class="bg-stone-100 font-sans text-stone-800 min-h-screen">

    <!-- PANEL PRINCIPAL DE ADMINISTRACIÓN -->

        const db = firebase.firestore();

        let listaCompletaAdmin = [];

        // Cargar y cruzar información entre 'invitados_planeados' y 'asistencias'
        async function cargarDatosAdmin() {
            const tbody = document.getElementById('tabla-body');
            tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-stone-400"><i class="fa-solid fa-spinner animate-spin"></i> Cargando datos...</td></tr>';

            try {
                // 1. Obtener planeados
                const planeadosSnap = await db.collection("invitados_planeados").get();
                // 2. Obtener respuestas
                const asistenciasSnap = await db.collection("asistencias").get();

                const mapaRespuestas = {};
                asistenciasSnap.forEach(doc => {
                    const data = doc.data();
                    if (data.familia) {
                        mapaRespuestas[data.familia.trim().toUpperCase()] = {
                            docId: doc.id,
                            ...data
                        };
                    }
                });

                listaCompletaAdmin = [];
                let totalPasesConfirmados = 0;
                let totalCancelados = 0;
                let totalPendientes = 0;

                planeadosSnap.forEach(doc => {
                    const planeado = doc.data();
                    const nombreFam = planeado.familia ? planeado.familia.trim() : "SIN NOMBRE";
                    const pasesAsignados = planeado.pases || 2;
                    const claveFam = nombreFam.toUpperCase();

                    const respuesta = mapaRespuestas[claveFam];

                    let item = {
                        familia: nombreFam,
                        pasesAsignados: pasesAsignados,
                        estatus: "PENDIENTE",
                        cantPersonas: 0,
                        confirmadoPor: "-",
                        mensaje: "-",
                        docId: respuesta ? respuesta.docId : null
                    };

                    if (respuesta) {
                        if (respuesta.asistencia) {
                            item.estatus = "CONFIRMADO";
                            item.cantPersonas = respuesta.cantPersonas || 0;
                            totalPasesConfirmados += item.cantPersonas;
                        } else {
                            item.estatus = "CANCELADO";
                            totalCancelados++;
                        }
                        item.confirmadoPor = respuesta.nombre || nombreFam;
                        item.mensaje = respuesta.mensaje || "";
                    } else {
                        totalPendientes++;
                    }

                    listaCompletaAdmin.push(item);
                });

                // Actualizar métricas
                document.getElementById('stat-total-familias').textContent = listaCompletaAdmin.length;
                document.getElementById('stat-pases-confirmados').textContent = totalPasesConfirmados;
                document.getElementById('stat-cancelados').textContent = totalCancelados;
                document.getElementById('stat-pendientes').textContent = totalPendientes;

                renderizarTabla(listaCompletaAdmin);

            } catch (error) {
                console.error("Error al cargar datos en admin:", error);
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-red-500">Error al cargar información de Firestore.</td></tr>';
            }
        }

        // Renderizar filas de la tabla
     // Renderizar filas de la tabla con botón de descarga PDF
function renderizarTabla(lista) {
    const tbody = document.getElementById('tabla-body');
    tbody.innerHTML = "";

    if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-stone-400">No se encontraron registros.</td></tr>';
        return;
    }

    lista.forEach(item => {
        let badgeEstatus = "";
        if (item.estatus === "CONFIRMADO") {
            badgeEstatus = '<span class="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded-full text-[10px]">✅ Confirmó</span>';
        } else if (item.estatus === "CANCELADO") {
            badgeEstatus = '<span class="bg-blue-100 text-blue-800 font-bold px-2.5 py-1 rounded-full text-[10px]">❌ Canceló</span>';
        } else {
            badgeEstatus = '<span class="bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-full text-[10px]">⏳ Sin Respuesta</span>';
        }

        const tr = document.createElement('tr');
        tr.className = "hover:bg-stone-50 transition border-b border-stone-100";

        // Botón de PDF habilitado únicamente si está CONFIRMADO
        const btnPdfHTML = item.estatus === "CONFIRMADO" ? `
            <button onclick="descargarTicketPDFAdmin({ familia: '${item.familia.replace(/'/g, "\\'")}', nombre: '${item.confirmadoPor.replace(/'/g, "\\'")}', cantPersonas: ${item.cantPersonas} }, '${item.docId || 'REG-2026'}')" class="bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold py-1.5 px-2.5 rounded-lg transition text-[11px] inline-flex items-center gap-1 border border-stone-300" title="Descargar Ticket PDF">
                <i class="fa-solid fa-file-pdf text-red-600"></i> PDF
            </button>
        ` : '';

        tr.innerHTML = `
            <td class="p-3 font-bold text-stone-900">${item.familia}</td>
            <td class="p-3">${badgeEstatus}</td>
            <td class="p-3"><span class="font-bold text-stone-800">${item.cantPersonas}</span> / <span class="text-stone-400">${item.pasesAsignados}</span></td>
            <td class="p-3 text-stone-600">${item.confirmadoPor}</td>
            <td class="p-3 text-stone-500 italic max-w-xs truncate">${item.mensaje || "-"}</td>
            <td class="p-3 text-center flex items-center justify-center gap-1.5">
                ${btnPdfHTML}
                <button onclick="abrirModalEdicion('${item.familia.replace(/'/g, "\\'")}')" class="bg-gold-100 hover:bg-gold-200 text-gold-800 font-bold py-1.5 px-3 rounded-lg transition text-[11px] inline-flex items-center gap-1">
                    <i class="fa-solid fa-pen-to-square"></i> Editar
                </button>
            </td>
        `;

        tbody.appendChild(tr);
    });
}

        // Filtros combinados de búsqueda y estatus
        function filtrarTabla() {
            const textoBusqueda = document.getElementById('busqueda-tabla').value.toLowerCase();
            const estatusFiltro = document.getElementById('filtro-estatus').value;

            const listaFiltrada = listaCompletaAdmin.filter(item => {
                const coincideTexto = item.familia.toLowerCase().includes(textoBusqueda) || item.confirmadoPor.toLowerCase().includes(textoBusqueda);
                const coincideEstatus = (estatusFiltro === "TODOS") || (item.estatus === estatusFiltro);
                return coincideTexto && coincideEstatus;
            });

            renderizarTabla(listaFiltrada);
        }

        // Abrir Modal de Edición
        function abrirModalEdicion(nombreFamilia) {
            const item = listaCompletaAdmin.find(i => i.familia === nombreFamilia);
            if (!item) return;

            document.getElementById('modal-titulo-familia').textContent = `Editar: ${item.familia}`;
            document.getElementById('edit-familia-nombre').value = item.familia;
            document.getElementById('edit-asistencia').value = item.estatus === "CANCELADO" ? "NO" : "SI";
            document.getElementById('edit-confirmante').value = item.confirmadoPor !== "-" ? item.confirmadoPor : item.familia;
            document.getElementById('edit-cantidad').value = item.estatus === "CONFIRMADO" ? item.cantPersonas : item.pasesAsignados;
            document.getElementById('edit-mensaje').value = item.mensaje !== "-" ? item.mensaje : "";

            document.getElementById('modal-editar').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modal-editar').classList.add('hidden');
        }

        // Guardar o Actualizar cambios directamente en Firestore
        async function guardarEdicionAdmin(e) {
            e.preventDefault();

            const btn = document.getElementById('btn-guardar-edit');
            btn.disabled = true;
            btn.textContent = "Guardando...";

            const familia = document.getElementById('edit-familia-nombre').value;
            const opcionAsistencia = document.getElementById('edit-asistencia').value;
            const confirmante = document.getElementById('edit-confirmante').value;
            const cantidad = parseInt(document.getElementById('edit-cantidad').value) || 0;
            const mensaje = document.getElementById('edit-mensaje').value;

            const esAsistenciaConfirmada = (opcionAsistencia === "SI");

            const datosActualizados = {
                familia: familia,
                nombre: confirmante,
                asistencia: esAsistenciaConfirmada,
                cantPersonas: esAsistenciaConfirmada ? cantidad : 0,
                mensaje: mensaje,
                fechaRegistro: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                // Buscar si existe el documento en asistencias
                const snap = await db.collection("asistencias").where("familia", "==", familia).get();

                if (!snap.empty) {
                    // Actualizar documento existente
                    const docId = snap.docs[0].id;
                    await db.collection("asistencias").doc(docId).set(datosActualizados, { merge: true });
                } else {
                    // Si estaba en PENDIENTE y el administrador le crea una respuesta
                    await db.collection("asistencias").add(datosActualizados);
                }

                cerrarModal();
                await cargarDatosAdmin(); // Recargar tabla y métricas
                alert("✅ Registro actualizado correctamente.");
            } catch (error) {
                console.error("Error al guardar edición de admin:", error);
                alert("Ocurrió un error al guardar los cambios.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Guardar Cambios";
            }
        }

        // Cargar datos automáticamente al abrir la página
        document.addEventListener("DOMContentLoaded", () => {
